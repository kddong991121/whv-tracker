<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/ui :: head('워홀 88 - 세컨 인정 지역 확인')}"></head>
<body>
<style>
    .big { font-size:20px; font-weight:800; margin:0 0 8px; }
    .ok { color:#14663C; } .warn { color:#92400E; } .no { color:#B42318; }
    .back { font-size:14px; font-weight:700; text-decoration:none; color:#2E6B52; }
</style>
<div class="app" th:style="${loggedIn} ? '' : 'padding-bottom:40px'">
    <header class="top">
        <div><div class="sub">포스트코드와 업종으로 확인해요</div><h1>세컨 인정 지역</h1></div>
        <!-- 로그인 전에는 하단 메뉴가 없으니 첫 화면으로 돌아가는 길을 위에 둔다 -->
        <a class="back" href="/" th:unless="${loggedIn}">처음으로</a>
    </header>

    <section class="card">
        <form method="get" action="/check">
            <label class="f" for="postcode">일한 곳 포스트코드 (숫자 4자리)</label>
            <input id="postcode" name="postcode" th:value="${postcode}" required pattern="[0-9]{4}" inputmode="numeric">
            <label class="f" for="industry">업종</label>
            <select id="industry" name="industry">
                <option value="TOURISM_HOSPITALITY" th:selected="${industry != null and industry.name() == 'TOURISM_HOSPITALITY'}">관광·요식업</option>
                <option value="REGIONAL_PRIMARY_MINING_CONSTRUCTION" th:selected="${industry == null or industry.name() == 'REGIONAL_PRIMARY_MINING_CONSTRUCTION'}">농장·축산·어업·임업·광업·건설</option>
                <option value="BUSHFIRE_RECOVERY" th:selected="${industry != null and industry.name() == 'BUSHFIRE_RECOVERY'}">산불 복구</option>
                <option value="NATURAL_DISASTER_RECOVERY" th:selected="${industry != null and industry.name() == 'NATURAL_DISASTER_RECOVERY'}">재해 복구 (홍수·사이클론 등)</option>
                <option value="COVID_HEALTHCARE" th:selected="${industry != null and industry.name() == 'COVID_HEALTHCARE'}">코로나 의료</option>
            </select>
            <label class="f" for="workType">농장 일이면 작업 종류</label>
            <select id="workType" name="workType">
                <option value="">해당 없음</option>
                <option th:each="w : ${workTypes}" th:value="${w.name()}" th:text="${w.label()}"></option>
            </select>
            <label class="f" for="disasterWorkType">재해 복구면 유급/봉사</label>
            <select id="disasterWorkType" name="disasterWorkType">
                <option value="">해당 없음</option>
                <option value="PAID">유급</option>
                <option value="VOLUNTEER">봉사</option>
            </select>
            <label class="f" for="lodgeDate">비자 신청 예정일 (비우면 오늘)</label>
            <input id="lodgeDate" type="date" name="lodgeDate">
            <button class="btn" type="submit" style="width:100%; margin-top:16px">확인하기</button>
        </form>
    </section>

    <section class="card" th:if="${error}"><p class="no" style="margin:0" th:text="${error}"></p></section>

    <section class="card" th:if="${result}">
        <p class="big" th:classappend="${result.status().name() == 'ELIGIBLE'} ? 'ok' : (${result.status().name() == 'CONDITIONAL'} ? 'warn' : 'no')"
           th:text="${result.status().message()}"></p>
        <p th:if="${result.multipleStates()}" class="warn">
            이 포스트코드는 여러 주에 걸쳐 있어요 (<span th:text="${#strings.setJoin(result.states(), ', ')}"></span>). 주에 따라 결과가 다를 수 있어요.
        </p>
        <p th:if="${result.status().name() == 'NOT_LISTED'}" class="muted">
            목록에 없는 곳은 여기서 판단할 수 없어요. 행정·청소 업무는 그 산업을 직접 지원하면 인정될 수 있다고 원문에 적혀 있어요.
        </p>
        <div th:if="${!result.conditions().isEmpty()}">
            <p class="muted">원문 표 조건 (근무 날짜도 확인하세요):</p>
            <ul><li class="muted" th:each="c : ${result.conditions()}" th:text="${c}"></li></ul>
        </div>
        <p class="muted">근거: 호주 내무부 specified work 페이지 표 1~6, 조사일 2026-11-10.
            <a th:href="${sourceUrl}">원문 보기</a></p>
    </section>

    <p class="muted" style="margin:12px 4px" th:text="${disclaimer}"></p>
</div>
<th:block th:if="${loggedIn}"><nav th:replace="~{fragments/ui :: nav('check')}"></nav></th:block>
</body>
</html>
