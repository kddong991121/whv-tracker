<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/ui :: head('워홀 88 - 내 계정')}"></head>
<body>
<div class="app">
    <header class="top"><div><div class="sub">로그인 정보</div><h1>내 계정</h1></div></header>
    <div class="flash err" th:if="${error}" th:text="${error}"></div>

    <section class="card">
        <p th:if="${user != null}" style="margin:0; font-weight:700" th:text="${user.displayName}"></p>
        <p th:if="${user != null}" class="label" style="margin:4px 0 14px" th:text="${user.email}"></p>
        <p th:if="${user == null}" class="muted">계정 정보를 찾지 못했어요. 다시 로그인하세요.</p>
        <form method="post" th:action="@{/logout}"><button class="btn ghost" type="submit">로그아웃</button></form>
    </section>

    <section class="card">
        <h2>기록 관리</h2>
        <p class="muted" style="margin:0"><a href="/ledger">전체 기록 보기·고치기</a> · <a href="/export">근무 이력 PDF</a> · <a href="/privacy">개인정보처리방침</a></p>
    </section>

    <section class="card" th:if="${user != null}">
        <h2 style="color:#B42318">탈퇴하기</h2>
        <p class="muted">계정과 모든 근무 기록, 페이슬립에서 읽은 값을 바로 지워요. <b>되돌릴 수 없어요.</b>
            필요하면 먼저 근무 이력 PDF를 받아 두세요.</p>
        <form method="post" th:action="@{/account/delete}">
            <label class="f" for="confirm">확인을 위해 "탈퇴"를 입력하세요</label>
            <input id="confirm" name="confirm" autocomplete="off" required>
            <button class="btn" type="submit" style="width:100%; margin-top:12px; background:#B42318">모든 기록 지우고 탈퇴</button>
        </form>
    </section>
    <p class="muted" style="margin:16px 4px" th:text="${disclaimer}"></p>
</div>
<nav th:replace="~{fragments/ui :: nav('')}"></nav>
</body>
</html>
