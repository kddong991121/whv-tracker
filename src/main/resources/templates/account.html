<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/ui :: head('워홀 88 - 내 계정')}"></head>
<body>
<div class="app">
    <header class="top"><div><div class="sub">로그인 정보</div><h1>내 계정</h1></div></header>
    <div class="flash err" th:if="${error}" th:text="${error}"></div>
    <style>
        label.goal { display:flex; gap:12px; align-items:flex-start; padding:12px; border:1px solid #E5E8EB; border-radius:14px; margin-top:8px; cursor:pointer; font-size:15px; }
        label.goal input { width:20px; height:20px; margin:2px 0 0; flex-shrink:0; }
        label.goal:has(input:checked) { border-color:#2E6B52; background:#F1F7F3; }
    </style>

    <section class="card">
        <p th:if="${user != null}" style="margin:0; font-weight:700" th:text="${user.displayName}"></p>
        <p th:if="${user != null}" class="label" style="margin:4px 0 14px" th:text="${user.email}"></p>
        <p th:if="${user == null}" class="muted">계정 정보를 찾지 못했어요. 다시 로그인하세요.</p>
        <form method="post" th:action="@{/logout}"><button class="btn ghost" type="submit">로그아웃</button></form>
    </section>

    <section class="card" id="goal" th:if="${user != null}">
        <h2>지금 준비 중인 비자</h2>
        <p class="muted" style="margin:0 0 12px">고른 비자 기준으로 홈 숫자와 남은 기간을 계산해요. 저장한 기록은 바뀌지 않아요.</p>
        <form method="post" th:action="@{/account/goal-visa}">
            <label class="goal"><input type="radio" name="goalVisa" value="2" th:checked="${user.goalVisa == 2}">
                <span><b>세컨 비자 (88일)</b><br><span class="muted">지금 1년차 워홀 비자예요</span></span></label>
            <label class="goal"><input type="radio" name="goalVisa" value="3" th:checked="${user.goalVisa == 3}">
                <span><b>서드 비자 (179일)</b><br><span class="muted">세컨을 받았고 지금 2년차 비자예요</span></span></label>
            <button class="btn" type="submit" style="width:100%; margin-top:12px">저장</button>
        </form>
    </section>

    <section class="card">
        <h2>기록 관리</h2>
        <p class="muted" style="margin:0"><a href="/ledger">전체 기록 보기·고치기</a> · <a href="/export">근무 이력 PDF</a> · <a href="/privacy">개인정보처리방침</a></p>
    </section>

    <section th:replace="~{fragments/ui :: share}"></section>
    <section class="card" th:if="${!#strings.isEmpty(feedbackUrl)}">
        <h2>의견 보내기</h2>
        <p class="muted" style="margin:0 0 12px">불편했던 점이나 있으면 좋겠는 기능을 알려주세요. Google 설문지가 새 창으로 열려요.</p>
        <a class="btn" style="width:100%; background:#2E6B52" th:href="${feedbackUrl}" target="_blank" rel="noopener">의견 보내기</a>
    </section>

    <section class="card" th:if="${user != null}">
        <h2 style="color:#B42318">탈퇴하기</h2>
        <p class="muted">계정과 모든 근무 기록, 페이슬립에서 읽은 값을 바로 지워요. <b>되돌릴 수 없어요.</b>
            필요하면 먼저 근무 이력 PDF를 받아 두세요.</p>
        <!-- 두 번 눌러도 요청은 한 번만 가게 버튼을 막는다 (탈퇴 Deadlock 재발 방지) -->
        <form method="post" th:action="@{/account/delete}" onsubmit="this.querySelector('button').disabled=true; this.querySelector('button').textContent='지우는 중…';">
            <label class="f" for="confirm">확인을 위해 "탈퇴"를 입력하세요</label>
            <input id="confirm" name="confirm" autocomplete="off" required>
            <button class="btn" type="submit" style="width:100%; margin-top:12px; background:#B42318">모든 기록 지우고 탈퇴</button>
        </form>
    </section>
    <p class="muted" style="margin:16px 4px" th:text="${disclaimer}"></p>
</div>
<nav th:replace="~{fragments/ui :: nav('')}"></nav>
</body>
</html>
