<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!-- 공통 스타일과 하단 메뉴. 색: 강조(일수·버튼) #2F6FEB, 배경은 호주 모래색 #F6F2EA, 보조색 유칼립투스 녹색 #2E6B52(메뉴·제목 표시), 흰 카드. -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">워홀 88</title>
    <th:block th:replace="~{fragments/pwa :: tags}"></th:block>
    <meta name="color-scheme" content="light dark">
    <!-- 카톡·SNS 공유 미리보기 (PRD 4.10c). 첫 화면, /check, 로그인에만 넣는다 (컨트롤러가 og=true) -->
    <th:block th:if="${og == true}">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="워홀 88">
        <meta property="og:title" content="워홀 88 · 세컨 비자 88일, 헷갈리지 않게">
        <meta property="og:description" content="호주 워홀 인정 근무를 기록하면 남은 일수와 페이스를 알려줘요. 한국어, 무료.">
        <meta property="og:image" th:content="${siteUrl} + '/icons/og.png'">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:url" th:content="${siteUrl} + '/'">
        <meta name="twitter:card" content="summary_large_image">
    </th:block>
    <!-- 방문 통계 (GoatCounter): 쿠키 없음, 개인 식별 정보 없음. 서버 설정이 있을 때만 넣는다 -->
    <script th:if="${!#strings.isEmpty(goatcounterUrl)}" th:attr="data-goatcounter=${goatcounterUrl}"
            async src="https://gc.zgo.at/count.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing:border-box; }
        [hidden] { display:none !important; } /* .btn 같은 display 규칙이 hidden 속성을 이기지 않게 */
        body { margin:0; background:#F6F2EA; color:#191F28; font-family:'Noto Sans KR','Malgun Gothic',sans-serif; }
        .app { max-width:480px; margin:0 auto; padding:0 16px 120px; }
        a { color:#2F6FEB; }
        header.top { padding:24px 4px 8px; display:flex; justify-content:space-between; align-items:center; }
        header.top .sub { font-size:13px; color:#2E6B52; font-weight:500; }
        header.top h1 { margin:0; font-size:22px; font-weight:800; }
        .icon-btn { width:44px; height:44px; border-radius:12px; background:#fff; display:flex; align-items:center; justify-content:center; text-decoration:none; color:#4E5968; font-size:20px; }
        .card { background:#fff; border-radius:20px; padding:20px; margin-top:12px; }
        .card h2 { margin:0 0 12px; font-size:17px; font-weight:700; }
        .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .grid2 > * { min-width:0; }
        .grid2 .card { padding:18px 16px; display:flex; flex-direction:column; gap:6px; }
        .label { font-size:13px; color:#4E5968; }
        .muted { font-size:12px; color:#4E5968; line-height:1.6; }
        .flash { padding:12px 14px; border-radius:12px; margin-top:12px; font-size:14px; }
        .flash.ok { background:#E7F6EE; color:#14663C; } .flash.err { background:#FDECEC; color:#B42318; }
        .notice { display:block; padding:12px 14px; border-radius:12px; background:#FEF3C7; color:#78350F; text-decoration:none; font-size:14px; line-height:1.5; }
        .btn { display:inline-flex; align-items:center; justify-content:center; height:48px; padding:0 18px; border:0; border-radius:14px; background:#2F6FEB; color:#fff; font-size:16px; font-weight:700; text-decoration:none; font-family:inherit; cursor:pointer; }
        .btn.ghost { background:#F2F4F6; color:#4E5968; height:44px; font-size:14px; }
        input, select { width:100%; height:44px; border:1px solid #D1D6DB; border-radius:10px; padding:0 10px; font-size:15px; font-family:inherit; background:#fff; }
        label.f { display:block; font-size:13px; color:#4E5968; margin:10px 0 4px; }
        .badge { padding:3px 10px; border-radius:8px; font-size:12px; font-weight:700; }
        .badge.sure { background:#E8F0FE; color:#1E40AF; } .badge.short { background:#FEF3C7; color:#78350F; } .badge.off { background:#F2F4F6; color:#4E5968; }
        .dot { width:10px; height:10px; border-radius:5px; display:inline-block; flex-shrink:0; }
        .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
        nav.tabs { position:fixed; left:0; right:0; bottom:0; height:68px; z-index:10; background:#fff; border-top:1px solid #E5E8EB; display:grid; grid-template-columns:repeat(4,1fr); }
        nav.tabs a { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:12px; color:#4E5968; text-decoration:none; }
        nav.tabs a { position:relative; }
        nav.tabs a.on { color:#2E6B52; font-weight:700; }
        nav.tabs a.on::before { content:''; position:absolute; top:0; left:30%; right:30%; height:3px; border-radius:0 0 3px 3px; background:#2E6B52; }
        nav.tabs svg.i { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
        nav.tabs a.on svg.i { stroke-width:2.2; }
        /* 떠 있는 "근무 추가" 버튼: 둥근 + 모양으로 작게 (달력 칸을 덜 가린다) */
        .fab { position:fixed; right:max(16px, calc(50% - 224px)); bottom:84px; width:56px; height:56px; border-radius:50%; background:#2F6FEB; color:#fff; font-size:30px; font-weight:400; line-height:1; text-decoration:none; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(47,111,235,.35); z-index:9; }
        /* 다크 모드 (PRD 4.10d): 휴대폰 설정을 따라간다. 화면별 style의 밝은 색도 여기서 덮는다 */
        @media (prefers-color-scheme: dark) {
            body { background:#111315; color:#E8EAED; }
            a { color:#8AB4FF; }
            header.top .sub { color:#7CC4A0; }
            .icon-btn, .card, nav.tabs { background:#1C1F23; }
            .icon-btn, .label, .muted, label.f, nav.tabs a { color:#A9B1BA; }
            nav.tabs { border-top-color:#2A2E33; }
            nav.tabs a.on { color:#7CC4A0; } nav.tabs a.on::before { background:#7CC4A0; }
            input, select, textarea { background:#24282D; color:#E8EAED; border-color:#3A4047; color-scheme:dark; }
            .btn.ghost { background:#2A2E33; color:#C9CED4; }
            .flash.ok { background:#16352A; color:#9BE0BC; } .flash.err { background:#3A1D1D; color:#F5A9A9; }
            .notice { background:#3A2F12; color:#F6D58A; }
            .badge.sure { background:#1C2F55; color:#AFC8FF; } .badge.short { background:#3A2F12; color:#F6D58A; } .badge.off { background:#2A2E33; color:#A9B1BA; }
            body.sunset { background:#111315 linear-gradient(180deg,#2B2118 0,#111315 260px) no-repeat; }
            /* 화면별 style에 박힌 밝은 색 덮기 */
            .ledger section, .stat { background:#1C1F23 !important; }
            .place, .day, .rec, .ob-step, .feat, label.goal { border-color:#2A2E33 !important; }
            .bar, .preview .bar, .ob-step .num, .x, .icon-btn[style] { background:#2A2E33 !important; color:#C9CED4; }
            label.goal:has(input:checked), .ob-goal button.on, .copy-week, .chip:active { background:#16352A !important; color:#9BE0BC; }
            .ob-goal button, .chip { background:#24282D; color:#E8EAED; border-color:#3A4047; }
            .pick { background:#16352A !important; }
            .pick b, .copy-week { color:#9BE0BC; }
            .flash.warn, .warn-list, .disclaimer { background:#3A2F12 !important; color:#F6D58A !important; }
            .feat .ic, .ghost-link, .quick.done { background:#16352A !important; color:#9BE0BC !important; }
            .quick.done a { color:#9BE0BC; }
            .cal .worked { background:#1C2F55; color:#AFC8FF; } .cal .short { background:#5A4710; color:#FDE68A; }
            .cal .today { box-shadow:inset 0 0 0 2px #E8EAED; }
            .big .of, .note, .meta, .hint, .sub, .add-pill, .legend { color:#A9B1BA; }
            .day > details[open] .add-pill { color:#E8EAED; }
            .days label { background:#24282D; border-color:#3A4047; color:#E8EAED; }
            .google:hover { background:#F1F3F4; }
            .ledger form label, .pick small, .hero p.lead, .feat span { color:#A9B1BA; }
            .status.ok, .ok { color:#7CC4A0 !important; } .status.warn, .warn { color:#F6D58A !important; } .no { color:#F5A9A9 !important; }
        }
        .install, .share { display:flex; gap:12px; align-items:center; }
        .install b, .share b { display:block; font-size:15px; } .install span, .share span { font-size:13px; color:#4E5968; line-height:1.5; }
        @media (prefers-color-scheme: dark) { .install span, .share span { color:#A9B1BA; } }
    </style>
</head>
<body>
<!-- 홈 화면에 추가 안내 (PRD 4.10b). 앱으로 열었거나 닫기를 눌렀으면 숨긴다. 기억은 이 기기 브라우저에만 -->
<section th:fragment="install" class="card install" id="install" hidden>
    <img src="/icons/icon-192.png" width="44" height="44" alt="" style="border-radius:12px">
    <div style="flex:1; min-width:0"><b>앱처럼 쓰기</b>
        <span id="installHow">홈 화면에 추가하면 바로 열 수 있어요.</span></div>
    <button class="btn" type="button" id="installBtn" style="height:40px; padding:0 14px; font-size:14px">추가</button>
    <button class="btn ghost" type="button" id="installClose" aria-label="닫기" style="height:40px; width:40px; padding:0">✕</button>
    <script>
    (function () {
        var box = document.getElementById('install'), btn = document.getElementById('installBtn');
        var KEY = 'whv88.installClosed', deferred = null;
        function closed() { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
        var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        if (standalone || closed()) { return; }
        var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
        if (ios) {
            document.getElementById('installHow').textContent = '사파리 아래 공유 버튼 → "홈 화면에 추가"를 눌러요.';
            btn.hidden = true; box.hidden = false;
        }
        window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault(); deferred = e; box.hidden = false;
        });
        btn.addEventListener('click', function () {
            if (!deferred) { return; }
            deferred.prompt();
            deferred.userChoice.finally(function () { deferred = null; box.hidden = true; });
        });
        document.getElementById('installClose').addEventListener('click', function () {
            try { localStorage.setItem(KEY, '1'); } catch (e) { }
            box.hidden = true;
        });
    })();
    </script>
</section>

<!-- 친구에게 알려주기 (PRD 4.10g). 휴대폰 공유 창, 안 되면 링크 복사. 보상·추천인 기록 없음 -->
<section th:fragment="share" class="card share">
    <div style="flex:1; min-width:0"><b>같이 일하는 친구에게 알려주기</b>
        <span>같은 농장 동료도 88일을 같이 세요.</span></div>
    <button class="btn" type="button" style="height:40px; padding:0 14px; font-size:14px; background:#2E6B52"
            onclick="whvShare(this)">공유</button>
    <script>
    function whvShare(btn) {
        var url = location.origin + '/?s=share';
        var data = { title: '워홀 88', text: '세컨 88일 같이 세요. 한국어 무료 계산기예요 👉', url: url };
        if (navigator.share) { navigator.share(data).catch(function () { }); return; }
        var done = function () { btn.textContent = '복사됨 ✓'; setTimeout(function () { btn.textContent = '공유'; }, 2000); };
        if (navigator.clipboard) { navigator.clipboard.writeText(data.text + ' ' + url).then(done, function () { prompt('이 링크를 복사하세요', url); }); }
        else { prompt('이 링크를 복사하세요', url); }
    }
    </script>
</section>

<!-- 주 1회 알림 (PRD 4.10e). mode=account: 켜기·끄기 카드, mode=home: 첫 근무 뒤 한 번 권하는 카드.
     서버에 키가 없으면(vapidPublic 빈 값) 아무것도 안 보인다. 허용 창은 버튼을 눌렀을 때만 뜬다 -->
<section th:fragment="push(mode)" th:if="${!#strings.isEmpty(vapidPublic)}" class="card share" id="push" hidden
         th:attr="data-key=${vapidPublic},data-mode=${mode}">
    <input type="hidden" id="pushCsrf" th:value="${_csrf != null} ? ${_csrf.token} : ''">
    <div style="flex:1; min-width:0"><b>주 1회 근무 알림</b>
        <span id="pushMsg">매주 일요일 저녁 7시(시드니 시간)에 이번 주 기록을 알려 드려요.</span></div>
    <button class="btn" type="button" id="pushBtn" style="height:40px; padding:0 14px; font-size:14px; white-space:nowrap">알림 받기</button>
    <button class="btn ghost" type="button" id="pushClose" aria-label="닫기" style="height:40px; width:40px; padding:0" hidden>✕</button>
    <script>
    (function () {
        var box = document.getElementById('push'), btn = document.getElementById('pushBtn'), msg = document.getElementById('pushMsg');
        var mode = box.dataset.mode, key = box.dataset.key, KEY = 'whv88.pushClosed';
        var supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
        var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
        var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        function closed() { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
        function say(t) { msg.textContent = t; }
        if (mode === 'home') {
            if (closed()) { return; }
            document.getElementById('pushClose').hidden = false;
            document.getElementById('pushClose').onclick = function () {
                try { localStorage.setItem(KEY, '1'); } catch (e) { }
                box.hidden = true;
            };
        }
        if (!supported) {
            if (mode === 'account') {
                say(ios && !standalone ? '아이폰은 사파리에서 "홈 화면에 추가"한 뒤, 그 앱에서 알림을 켤 수 있어요.'
                                       : '이 브라우저는 알림을 지원하지 않아요.');
                btn.hidden = true; box.hidden = false;
            }
            return;
        }
        if (Notification.permission === 'denied') {
            if (mode === 'account') { say('브라우저 설정에서 이 사이트 알림이 막혀 있어요. 설정에서 허용으로 바꿔 주세요.'); btn.hidden = true; box.hidden = false; }
            return;
        }
        function b64ToBytes(s) {
            s = s.replace(/-/g, '+').replace(/_/g, '/'); s += '='.repeat((4 - s.length % 4) % 4);
            var raw = atob(s), out = new Uint8Array(raw.length);
            for (var i = 0; i < raw.length; i++) { out[i] = raw.charCodeAt(i); }
            return out;
        }
        function post(url, data) {
            data._csrf = document.getElementById('pushCsrf').value;
            return fetch(url, { method: 'POST', body: new URLSearchParams(data), headers: { 'Accept': 'application/json' } })
                .then(function (r) { return (r.headers.get('content-type') || '').indexOf('json') >= 0 ? r.json() : { ok: false, error: '다시 로그인해 주세요.' }; });
        }
        var current = null;
        function show(sub) {
            current = sub;
            if (mode === 'home') { box.hidden = !!sub; if (sub) { return; } }
            box.hidden = false;
            btn.textContent = sub ? '알림 끄기' : '알림 받기';
            btn.className = sub ? 'btn ghost' : 'btn';
            if (mode === 'account') { say(sub ? '이 기기에서 알림을 받고 있어요 · 매주 일요일 저녁 7시(시드니 시간).' : '매주 일요일 저녁 7시(시드니 시간)에 이번 주 기록을 알려 드려요.'); }
        }
        navigator.serviceWorker.ready.then(function (reg) {
            return reg.pushManager.getSubscription().then(function (sub) {
                show(sub);
                btn.onclick = function () {
                    btn.disabled = true;
                    if (current) {
                        var ep = current.endpoint;
                        current.unsubscribe().then(function () { return post('/push/unsubscribe', { endpoint: ep }); })
                            .then(function () { show(null); say('알림을 껐어요.'); }).finally(function () { btn.disabled = false; });
                        return;
                    }
                    Notification.requestPermission().then(function (p) {
                        if (p !== 'granted') { say('알림을 허용해야 받을 수 있어요.'); return null; }
                        // 알림 서버 연결이 막히면 끝없이 기다릴 수 있어 20초에서 끊는다
                        return Promise.race([reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) }),
                                new Promise(function (_, no) { setTimeout(function () { no(new Error('timeout')); }, 20000); })])
                            .then(function (s) {
                                var j = s.toJSON();
                                return post('/push/subscribe', { endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth })
                                    .then(function (r) {
                                        if (r.ok) { show(s); if (mode === 'home') { box.hidden = false; btn.hidden = true; say('알림을 켰어요. 확인 알림을 보냈어요.'); } }
                                        else { s.unsubscribe(); say(r.error || '알림을 켜지 못했어요.'); }
                                    });
                            });
                    }).catch(function () { say('알림을 켜지 못했어요. 잠시 뒤 다시 해 주세요.'); })
                      .finally(function () { btn.disabled = false; });
                };
            });
        });
    })();
    </script>
</section>

<nav class="tabs" th:fragment="nav(active)" aria-label="하단 메뉴">
    <!-- 아이콘: 직접 그린 단순 선 아이콘 (24×24, 글자색을 따름) -->
    <a href="/" th:classappend="${active == 'home'} ? 'on'"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg>홈</a>
    <a href="/work" th:classappend="${active == 'work'} ? 'on'"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/></svg>근무 기록</a>
    <a href="/check" th:classappend="${active == 'check'} ? 'on'"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>인정 지역</a>
    <a href="/payslip" th:classappend="${active == 'payslip'} ? 'on'"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>페이슬립</a>
</nav>

</body>
</html>
