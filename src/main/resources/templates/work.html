<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/ui :: head('워홀 88 - 근무 기록')}"></head>
<body>
<style>
    .day { padding:14px 0; border-bottom:1px solid #F2F4F6; }
    .shift { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; font-size:14px; }
    .shift form { margin:0; }
    .x { width:36px; height:36px; border:0; border-radius:10px; background:#F2F4F6; color:#4E5968; font-size:16px; cursor:pointer; }
    details summary { cursor:pointer; font-size:13px; color:#4E5968; margin-top:8px; list-style:none; display:inline-block;
        border:1px dashed #B0B8C1; border-radius:10px; padding:6px 12px; }
    .addrow { display:grid; grid-template-columns:1fr 90px 80px; gap:6px; margin-top:8px; }
    .addrow .btn { height:44px; font-size:14px; padding:0; }
    .sum { display:grid; grid-template-columns:repeat(3,1fr); text-align:center; }
    .sum b { display:block; font-size:20px; font-weight:800; }
</style>
<div class="app">
    <header class="top"><div><div class="sub">날짜마다 여러 곳 근무를 넣을 수 있어요</div><h1>근무 기록</h1></div></header>
    <div class="flash ok" th:if="${message}" th:text="${message}"></div>
    <div class="flash err" th:if="${error}" th:text="${error}"></div>

    <section class="card">
        <h2>내 일터</h2>
        <p class="muted" th:if="${places.isEmpty()}">먼저 일터를 추가하세요.</p>
        <div style="display:flex; align-items:flex-start; gap:8px; padding:6px 0" th:each="p : ${places}">
            <span class="dot" style="margin-top:6px" th:style="'margin-top:6px; background:' + ${p.color()}"></span>
            <div><div style="font-size:14px" th:text="${p.name()}"></div><div class="label" th:text="${p.detail()}"></div></div>
        </div>
        <p class="muted" th:each="p : ${places}" th:if="${!p.counted()}" th:text="${p.name()} + ': ' + ${p.status()} + ' · 합계에 넣지 않아요'"></p>
        <p class="muted">'하루 몇 시간'은 그 일터에서 보통 하루 일하는 시간이에요. 이보다 짧게 일한 날은 따로 표시해요.</p>
        <details>
            <summary>+ 일터 추가</summary>
            <form method="post" th:action="@{/work/place}">
                <label class="f">일터 이름</label><input name="employer" required maxlength="100">
                <label class="f">포스트코드 (숫자 4자리)</label><input name="postcode" required pattern="[0-9]{4}" inputmode="numeric">
                <label class="f">업종</label>
                <select name="industry">
                    <option value="REGIONAL_PRIMARY_MINING_CONSTRUCTION">농장·축산·어업·임업·광업·건설</option>
                    <option value="TOURISM_HOSPITALITY">관광·요식업</option>
                    <option value="BUSHFIRE_RECOVERY">산불 복구</option>
                    <option value="NATURAL_DISASTER_RECOVERY">재해 복구</option>
                </select>
                <label class="f">농장 일이면 작업 종류</label>
                <select name="workType"><option value="">해당 없음</option>
                    <option th:each="w : ${workTypes}" th:value="${w.name()}" th:text="${w.label()}"></option></select>
                <label class="f">평소 하루 근무 시간</label><input type="number" name="normalHours" step="0.5" min="0.5" max="24" value="8" required>
                <label class="f">일한 기간 (시작)</label><input type="date" name="startDate" required>
                <label class="f">일한 기간 (끝, 아직 일하면 예정일)</label><input type="date" name="endDate" required>
                <button class="btn" type="submit" style="width:100%; margin-top:14px">일터 저장</button>
                <p class="muted">매일 출근하는 정규 근무는 <a href="/ledger">상세</a> 화면에서 기간으로 넣어요.</p>
            </form>
        </details>
    </section>

    <section class="card">
        <div class="row">
            <h2 style="margin:0" th:text="${monday.monthValue} + '월 ' + ${monday.dayOfMonth} + '일 – ' + ${sunday.monthValue} + '월 ' + ${sunday.dayOfMonth} + '일'"></h2>
            <span style="display:flex; gap:4px">
                <a class="icon-btn" style="background:#F2F4F6" th:href="@{/work(week=${prevWeek})}" aria-label="이전 주">‹</a>
                <a class="icon-btn" style="background:#F2F4F6" th:href="@{/work(week=${nextWeek})}" aria-label="다음 주">›</a>
            </span>
        </div>
        <div class="day" th:each="d : ${days}">
            <div class="row"><b style="font-size:15px" th:text="${d.label()}"></b><span class="badge" th:classappend="${d.badgeCss()}" th:text="${d.badge()}"></span></div>
            <div class="shift" th:each="sh : ${d.shifts()}">
                <span style="display:flex; align-items:center; gap:8px"><span class="dot" th:style="'background:' + ${sh.color()}"></span>
                    <span th:text="${sh.employer()}"></span></span>
                <span style="display:flex; align-items:center; gap:8px">
                    <b th:text="${sh.hours()}" th:style="${sh.full()} ? '' : 'color:#92400E'"></b>
                    <form method="post" th:action="@{/work/shift/{id}/delete(id=${sh.id()})}">
                        <input type="hidden" name="week" th:value="${monday}">
                        <button class="x" type="submit" th:attr="aria-label=${d.label()} + ' ' + ${sh.employer()} + ' 근무 지우기'">✕</button>
                    </form>
                </span>
            </div>
            <p class="muted" style="color:#78350F; margin:6px 0 0" th:if="${!d.note().isEmpty()}" th:text="${d.note()}"></p>
            <details th:if="${!places.isEmpty()}">
                <summary>+ 근무</summary>
                <form method="post" th:action="@{/work/shift}" class="addrow">
                    <input type="hidden" name="workDate" th:value="${d.date()}">
                    <select name="recordId" aria-label="일터"><option th:each="p : ${places}" th:value="${p.id()}" th:text="${p.name()}"></option></select>
                    <input type="number" name="workHours" step="0.5" min="0.5" max="24" value="8" aria-label="근무 시간" required>
                    <button class="btn" type="submit">추가</button>
                </form>
            </details>
        </div>
    </section>

    <section class="card sum">
        <div><span class="label">일한 날</span><b th:text="${worked} + '일'"></b></div>
        <div><span class="label">인정</span><b style="color:#2F6FEB" th:text="${sure} + '일'"></b></div>
        <div><span class="label">짧게 일한 날</span><b style="color:#92400E" th:text="${shortDays} + '일'"></b></div>
    </section>
    <p class="muted" style="margin:12px 4px">주 5일 일하면 7일로 쳐줘요 (주말 포함). 하루에 두 곳에서 일해도 1일을 넘지 않아요.
        짧게 일한 날은 인정 안 될 수도 있어서 홈 화면 숫자에 넣지 않아요.</p>
    <p class="muted" style="margin:0 4px" th:text="${disclaimer}"></p>
</div>
<nav th:replace="~{fragments/ui :: nav('work')}"></nav>
</body>
</html>
