<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/ui :: head('워홀 88 - 운영 현황')}"></head>
<body>
<style>
    .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
    .stat-grid > * { min-width:0; }
    .stat { background:#fff; border-radius:20px; padding:16px 18px; }
    .stat .k { font-size:13px; color:#4E5968; }
    .stat .v { font-size:28px; font-weight:800; margin-top:4px; }
    .stat .s { font-size:12px; color:#4E5968; margin-top:2px; }
    .bars { display:flex; align-items:flex-end; gap:4px; height:90px; margin-top:12px; }
    .bars div { flex:1; background:#2E6B52; border-radius:4px 4px 0 0; min-height:2px; position:relative; }
    .bars span { position:absolute; top:-16px; left:0; right:0; text-align:center; font-size:10px; color:#4E5968; }
    .days { display:flex; gap:4px; margin-top:4px; }
    .days span { flex:1; text-align:center; font-size:10px; color:#4E5968; }
</style>
<div class="app">
    <header class="top"><div><div class="sub">운영자만 볼 수 있어요 · 숫자만 보여줘요</div><h1>운영 현황</h1></div></header>

    <div class="stat-grid">
        <div class="stat"><div class="k">전체 가입자</div><div class="v" th:text="${stats.totalUsers()} + '명'"></div></div>
        <div class="stat"><div class="k">오늘 가입</div><div class="v" th:text="${stats.todaySignups()} + '명'"></div></div>
        <div class="stat"><div class="k">최근 7일 방문</div><div class="v" th:text="${stats.activeLast7Days()} + '명'"></div>
            <div class="s">로그인한 사용자 기준</div></div>
        <div class="stat"><div class="k">근무를 넣은 사람</div><div class="v" th:text="${stats.usersWithRecords()} + '명'"></div>
            <div class="s" th:text="'가입만 한 사람 ' + ${stats.totalUsers() - stats.usersWithRecords()} + '명'"></div></div>
        <div class="stat"><div class="k">세컨 / 서드 준비</div><div class="v" th:text="${stats.secondGoal()} + ' / ' + ${stats.thirdGoal()}"></div></div>
        <div class="stat"><div class="k">최근 30일 탈퇴</div><div class="v" th:text="${stats.deletedLast30Days()} + '명'"></div></div>
    </div>

    <section class="card">
        <h2>다시 쓰는지</h2>
        <div class="stat-grid">
            <div class="stat"><div class="k">다시 온 사람</div><div class="v" th:text="${stats.returnedUsers()} + '명'"></div>
                <div class="s" th:text="'가입한 날 뒤에 또 방문 · 전체의 ' + ${stats.returnedPercent()} + '%'"></div></div>
            <div class="stat"><div class="k">최근 7일 기록한 사람</div><div class="v" th:text="${stats.recordedLast7Days()} + '명'"></div>
                <div class="s" th:text="'근무를 넣은 사람의 ' + ${stats.recordedLast7Percent()} + '%'"></div></div>
        </div>
        <p class="muted" style="margin:8px 0 0">근무를 적은 시각은 11월 12일 배포 뒤부터 쌓여요.</p>
    </section>

    <section class="card">
        <h2>최근 14일 가입</h2>
        <div class="bars">
            <div th:each="d : ${stats.signupsByDay()}"
                 th:style="'height:' + ${d.count() * 100 / stats.maxDaily()} + '%'">
                <span th:if="${d.count() > 0}" th:text="${d.count()}"></span></div>
        </div>
        <div class="days"><span th:each="d : ${stats.signupsByDay()}" th:text="${d.day().dayOfMonth}"></span></div>
    </section>
    <p class="muted" style="margin:12px 4px">기준 시간: 서버(시드니). 방문 통계(전체 방문 수, 유입 경로)는 GoatCounter에서 봐요.</p>
</div>
</body>
</html>
