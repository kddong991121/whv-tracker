<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/ui :: head('워홀 88 - 로그인')}"></head>
<body>
<th:block th:replace="~{fragments/auth :: style}"></th:block>
<div class="app" style="padding-bottom:40px">
    <section class="hero">
        <img class="logo" src="/icons/icon-192.png" alt="워홀 88">
        <h1>로그인</h1>
        <p class="lead">구글 계정으로 바로 시작해요.<br>비밀번호는 이 서비스에 저장하지 않아요.</p>
    </section>

    <div class="flash err" th:if="${error == 'account'}">구글 계정 정보를 확인하지 못했어요. 이메일 권한을 허용하고 다시 시도해 주세요.</div>
    <div class="flash err" th:if="${error != null and error != 'account'}">로그인에 실패했어요. 다시 시도해 주세요.</div>

    <div style="margin-top:24px"><a th:replace="~{fragments/auth :: google}"></a></div>
    <p class="muted" style="text-align:center; margin-top:14px">로그인하면 <a href="/privacy">개인정보처리방침</a>에 동의한 것으로 봐요.</p>
    <p class="muted" style="text-align:center; margin-top:24px"><a href="/">처음으로</a></p>
</div>
</body>
</html>
