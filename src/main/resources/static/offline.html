<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>워홀 88 - 연결 없음</title>
    <style>
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#F2F4F6;
               font-family:'Noto Sans KR','Malgun Gothic',sans-serif; color:#191F28; text-align:center; padding:24px; }
        div { background:#fff; border-radius:20px; padding:28px 24px; max-width:340px; }
        button { margin-top:16px; height:48px; padding:0 24px; border:0; border-radius:14px; background:#2F6FEB; color:#fff; font-size:16px; font-weight:700; }
    </style>
</head>
<body>
<div>
    <h1 style="font-size:20px">인터넷에 연결되어 있지 않아요</h1>

    <button type="button" onclick="location.reload()">다시 시도</button>
</div>
</body>
</html>
