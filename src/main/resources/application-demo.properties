# 데모 프로필: H2 메모리 DB (MySQL 모드). MySQL 설치 없이 바로 실행한다.
# 종료하면 데이터가 사라지며, 기동 시 샘플 데이터를 자동으로 넣는다 (DemoDataLoader).
# IDE 실행 설정에서 활성 프로필을 demo로 지정하거나 SPRING_PROFILES_ACTIVE=demo 를 설정한다.
spring.datasource.url=jdbc:h2:mem:whvdemo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
