spring.application.name=whv-tracker
server.port=${PORT:8080}

# MySQL 접속 정보는 환경변수로 지정한다. 비밀번호는 파일에 넣지 않는다.
spring.datasource.url=jdbc:mysql://${WHV_DB_HOST:localhost}:${WHV_DB_PORT:3306}/${WHV_DB_NAME:whv_tracker}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${WHV_DB_USER:whv}
spring.datasource.password=${WHV_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 구글 로그인 (OAuth2 Client). 값은 환경변수로만 받는다.
# 환경변수가 없으면 아래 자리표시 값으로 기동만 되고, 구글 로그인 단계에서 실패한다 (빈 값은 기동을 막는다).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:missing-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:missing-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

spring.thymeleaf.cache=false

# 개인정보처리방침에 표시할 문의 이메일 (서버 환경변수로 지정)
whv.contact-email=${WHV_CONTACT_EMAIL:}
# 의견 보내기 링크 (Google 설문지 응답용 링크). 비우면 화면에 링크를 숨긴다.
whv.feedback-url=${WHV_FEEDBACK_URL:}
# 방문 통계 (GoatCounter, 쿠키 없음). 예: https://kddong99.goatcounter.com/count. 비우면 집계하지 않는다.
whv.goatcounter-url=${WHV_GOATCOUNTER_URL:}
